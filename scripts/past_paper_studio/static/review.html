<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review · Conversion Studio</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/static/studio.css" />
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/katex/contrib/mhchem.min.js"></script>
    <script>
      /* Local vendor path first; fall back to jsDelivr if node_modules is missing. */
      (function ensureKatex() {
        function loadCss(href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        }
        function loadScript(src, onload) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = onload;
          document.head.appendChild(script);
        }
        if (window.katex && typeof window.katex.renderToString === "function") return;
        var cdn = "https://cdn.jsdelivr.net/npm/katex@0.16.27/dist";
        loadCss(cdn + "/katex.min.css");
        loadScript(cdn + "/katex.min.js", function () {
          loadScript(cdn + "/contrib/mhchem.min.js", function () {
            window.dispatchEvent(new Event("katex-ready"));
          });
        });
      })();
    </script>
  </head>
  <body class="review-page">
    <div class="topbar">
      <a id="back"><button class="ghost">← Paper</button></a>
      <span class="crumb" id="crumb"></span>
      <div class="spacer"></div>
      <span class="chips" id="status-tags"></span>
      <button class="ghost" id="prev">Prev</button>
      <button class="ghost" id="next">Next</button>
      <span class="muted" id="save-status" style="font-size:12.5px;min-width:7rem;text-align:right"></span>
      <button class="good" id="save" title="Save in the background and open the next question (Ctrl+Enter)">Save &amp; next</button>
    </div>

    <div class="review-shell">
      <aside class="q-rail" id="q-rail" aria-label="Questions in this paper">
        <div class="q-rail-head">
          <span>Questions</span>
          <span class="muted" id="q-rail-count"></span>
        </div>
        <div class="q-rail-list" id="q-rail-list">
          <div class="muted" style="padding:10px 8px;font-size:12.5px">Loading…</div>
        </div>
      </aside>

      <div class="wrap wide review-main">
        <div id="banners"></div>

        <div class="split">
          <div class="pane">
            <div class="pane-head">
              <span>Original screenshot</span>
              <div class="spacer" style="flex:1"></div>
              <span class="muted" id="source-meta" style="font-weight:400"></span>
            </div>
            <div class="pane-body tight" id="source-pane"></div>
          </div>

          <div class="pane">
            <div class="pane-head">
              <span>Converted question</span>
              <div class="spacer" style="flex:1"></div>
              <label class="muted row" style="font-weight:400;gap:6px">
                <input type="checkbox" id="show-answer" style="width:auto" checked />
                highlight answer
              </label>
            </div>
            <div class="pane-body" id="preview-pane"></div>
          </div>
        </div>

        <div class="pane" style="margin-top:16px">
          <div class="pane-head">
            <span>Edit</span>
            <div class="spacer" style="flex:1"></div>
            <label class="muted row" style="font-weight:400;gap:6px">
              <input type="checkbox" id="mark-reviewed" style="width:auto" />
              mark hand-checked
            </label>
          </div>
          <div class="pane-body">
            <div class="split">
              <div>
                <div class="field">
                  <label>Question text (KaTeX, markdown tables)</label>
                  <textarea id="stem" rows="12"></textarea>
                </div>
                <div class="field">
                  <label>Answer key</label>
                  <div class="chips" id="answer-chips"></div>
                </div>
              </div>
              <div>
                <div class="field">
                  <label>Options</label>
                  <div id="options"></div>
                </div>
                <div class="field">
                  <label>Diagrams and graphs</label>
                  <div id="assets"></div>
                  <button class="ghost" id="add-asset" style="margin-top:6px">+ Add diagram from screenshot</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="margin:16px 0 40px">
          <div class="muted" style="font-size:12.5px" id="meta"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/static/review.js"></script>
  </body>
</html>
