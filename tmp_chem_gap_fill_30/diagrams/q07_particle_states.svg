<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <style>
    .box { fill: #ffffff; stroke: #222222; stroke-width: 2; }
    .dot { fill: #111111; }
    .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #111111; }
  </style>

  <!-- A: solid lattice -->
  <rect class="box" x="20" y="28" width="150" height="150" rx="0"/>
  <g transform="translate(35,43)">
    <circle class="dot" cx="15" cy="15" r="7"/><circle class="dot" cx="45" cy="15" r="7"/><circle class="dot" cx="75" cy="15" r="7"/><circle class="dot" cx="105" cy="15" r="7"/>
    <circle class="dot" cx="15" cy="45" r="7"/><circle class="dot" cx="45" cy="45" r="7"/><circle class="dot" cx="75" cy="45" r="7"/><circle class="dot" cx="105" cy="45" r="7"/>
    <circle class="dot" cx="15" cy="75" r="7"/><circle class="dot" cx="45" cy="75" r="7"/><circle class="dot" cx="75" cy="75" r="7"/><circle class="dot" cx="105" cy="75" r="7"/>
    <circle class="dot" cx="15" cy="105" r="7"/><circle class="dot" cx="45" cy="105" r="7"/><circle class="dot" cx="75" cy="105" r="7"/><circle class="dot" cx="105" cy="105" r="7"/>
  </g>
  <text class="label" x="95" y="22" text-anchor="middle">A</text>

  <!-- B: liquid disordered close -->
  <rect class="box" x="198" y="28" width="150" height="150" rx="0"/>
  <g transform="translate(213,43)">
    <circle class="dot" cx="22" cy="98" r="7"/><circle class="dot" cx="48" cy="108" r="7"/><circle class="dot" cx="74" cy="95" r="7"/><circle class="dot" cx="102" cy="104" r="7"/>
    <circle class="dot" cx="18" cy="72" r="7"/><circle class="dot" cx="44" cy="78" r="7"/><circle class="dot" cx="70" cy="66" r="7"/><circle class="dot" cx="98" cy="74" r="7"/>
    <circle class="dot" cx="30" cy="48" r="7"/><circle class="dot" cx="58" cy="52" r="7"/><circle class="dot" cx="86" cy="42" r="7"/><circle class="dot" cx="110" cy="54" r="7"/>
    <circle class="dot" cx="40" cy="28" r="7"/><circle class="dot" cx="72" cy="24" r="7"/><circle class="dot" cx="96" cy="32" r="7"/>
  </g>
  <text class="label" x="273" y="22" text-anchor="middle">B</text>

  <!-- C: gas sparse -->
  <rect class="box" x="376" y="28" width="150" height="150" rx="0"/>
  <g transform="translate(391,43)">
    <circle class="dot" cx="18" cy="20" r="7"/>
    <circle class="dot" cx="105" cy="38" r="7"/>
    <circle class="dot" cx="48" cy="78" r="7"/>
    <circle class="dot" cx="112" cy="100" r="7"/>
    <circle class="dot" cx="28" cy="120" r="7"/>
  </g>
  <text class="label" x="451" y="22" text-anchor="middle">C</text>

  <!-- D: spaced regular lattice -->
  <rect class="box" x="554" y="28" width="150" height="150" rx="0"/>
  <g transform="translate(569,43)">
    <circle class="dot" cx="20" cy="20" r="7"/><circle class="dot" cx="60" cy="20" r="7"/><circle class="dot" cx="100" cy="20" r="7"/>
    <circle class="dot" cx="20" cy="60" r="7"/><circle class="dot" cx="60" cy="60" r="7"/><circle class="dot" cx="100" cy="60" r="7"/>
    <circle class="dot" cx="20" cy="100" r="7"/><circle class="dot" cx="60" cy="100" r="7"/><circle class="dot" cx="100" cy="100" r="7"/>
  </g>
  <text class="label" x="629" y="22" text-anchor="middle">D</text>
</svg>
