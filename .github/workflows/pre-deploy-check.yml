# Catch the same failures Vercel hits on `next build`.
# Plain `tsc` misses Next.js route export rules (e.g. exporting helpers from route.ts).

name: Pre-deploy check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pre-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predeploy:
    name: Next.js build gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check route exports
        run: npm run check:routes

      - name: Next.js production build
        env:
          # Placeholders are enough to compile; this mirrors Vercel type/route checks.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build
