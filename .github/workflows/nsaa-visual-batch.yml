# NSAA visual_engine batch (runs in the cloud)
# Default path matches local: visual_engine.nsaa_esat_batch
# (Math 1 : Math 2 : Physics = 1:1:3, Math 100% diagrams, Physics mixed)

name: NSAA visual batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Batch mode
        required: true
        default: esat
        type: choice
        options:
          - esat
          - chemistry
          - biology
      cycles:
        description: ESAT cycles (each = 1 Math1 + 1 Math2 + 3 Physics). Use 0 for until sources run out.
        required: true
        default: "5"
        type: string
      n:
        description: Chemistry/biology only. How many questions to generate.
        required: false
        default: "5"
        type: string
      diagrams_only:
        description: Chemistry/biology only. Keep rendered diagram questions.
        required: false
        default: true
        type: boolean
      only_visuals:
        description: Chemistry/biology only. Optional visual_type allow-list. Empty = auto by subject.
        required: false
        default: ""
        type: string
      force:
        description: Ignore already-ticked sources / regenerate
        required: true
        default: false
        type: boolean
      model:
        description: Gemini / Vertex model id
        required: false
        default: "gemini-3.7-flash"
        type: string
  # Daily schedule removed (was 10:00 UTC). Manual runs only via workflow_dispatch.

concurrency:
  group: nsaa-visual-batch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  generate:
    name: Generate NSAA review items
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: question-generation/esat_question_generator

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/question-generation:${{ github.workspace }}/question-generation/esat_question_generator
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      # Match local .env.local: global + no remap. Secret overrides if set.
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
      VERTEX_GENAI_NO_GLOBAL_REMAP: ${{ secrets.VERTEX_GENAI_NO_GLOBAL_REMAP }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MODEL_DIAGRAM_DESIGNER: gemini-3.7-flash
      DIAGRAM_GEMINI_TIMEOUT_S: "240"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: question-generation/esat_question_generator/visual_engine/requirements.txt

      - name: Authenticate to Google Cloud (Vertex AI)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install system deps for RDKit / Matplotlib
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxrender1 libxext6 libsm6

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r visual_engine/requirements.txt

      - name: Resolve batch parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="esat"
            CYCLES="5"
            N="5"
            DIAG="true"
            ONLY=""
            FORCE="false"
            MODEL="gemini-3.7-flash"
          else
            MODE="${{ inputs.mode }}"
            CYCLES="${{ inputs.cycles }}"
            N="${{ inputs.n }}"
            DIAG="${{ inputs.diagrams_only }}"
            ONLY="${{ inputs.only_visuals }}"
            FORCE="${{ inputs.force }}"
            MODEL="${{ inputs.model }}"
          fi

          if [ -z "$ONLY" ]; then
            case "$MODE" in
              chemistry) ONLY="chem_structure,graph,energy_profile" ;;
              biology) ONLY="graph,bio_diagram,pedigree" ;;
              *) ONLY="" ;;
            esac
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "cycles=$CYCLES" >> "$GITHUB_OUTPUT"
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "diagrams_only=$DIAG" >> "$GITHUB_OUTPUT"
          echo "only_visuals=$ONLY" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE cycles=$CYCLES n=$N force=$FORCE model=$MODEL"

      - name: Restore previous review_data (tick-off continuity)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workflow: nsaa-visual-batch.yml
          workflow_conclusion: success
          name_is_regexp: true
          name: nsaa-review-esat-.*
          path: ${{ github.workspace }}/_prev_artifacts
          if_no_artifact_found: warn
          search_artifacts: true

      - name: Unpack previous review_data if present
        shell: bash
        working-directory: question-generation/esat_question_generator
        run: |
          set -euo pipefail
          mkdir -p visual_engine/review_data
          PREV="$(find "$GITHUB_WORKSPACE/_prev_artifacts" -name 'nsaa-review-data.tgz' 2>/dev/null | head -n 1 || true)"
          if [ -n "${PREV:-}" ] && [ -f "$PREV" ]; then
            echo "Restoring review_data from $PREV"
            tar -xzf "$PREV" -C visual_engine
            ls -la visual_engine/review_data || true
          else
            echo "No previous review_data artifact found; starting fresh tick-off state"
          fi

      - name: Preflight secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in GOOGLE_CLOUD_PROJECT SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret/env: $key"
              missing=1
            fi
          done
          # Force local parity for this workflow (local .env.local uses global + remap=1).
          # Repo secrets may still be us-central1 from older setup; that 404s gemini-3.7-flash.
          echo "Aligning Vertex location with local: GOOGLE_CLOUD_LOCATION=global VERTEX_GENAI_NO_GLOBAL_REMAP=1"
          echo "GOOGLE_CLOUD_LOCATION=global" >> "$GITHUB_ENV"
          echo "VERTEX_GENAI_NO_GLOBAL_REMAP=1" >> "$GITHUB_ENV"
          export GOOGLE_CLOUD_LOCATION=global
          export VERTEX_GENAI_NO_GLOBAL_REMAP=1
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Preflight OK (project=$GOOGLE_CLOUD_PROJECT location=$GOOGLE_CLOUD_LOCATION remap_guard=${VERTEX_GENAI_NO_GLOBAL_REMAP} model=${MODEL_DIAGRAM_DESIGNER:-})"

      - name: Run NSAA ESAT batch (Math1 / Math2 / Physics)
        if: steps.params.outputs.mode == 'esat'
        shell: bash
        run: |
          set -euo pipefail
          MODEL="${{ steps.params.outputs.model }}"
          CYCLES="${{ steps.params.outputs.cycles }}"
          FORCE="${{ steps.params.outputs.force }}"
          if [ -n "$MODEL" ]; then
            export MODEL_DIAGRAM_DESIGNER="$MODEL"
          fi
          ARGS=(--cycles "$CYCLES" --model "${MODEL_DIAGRAM_DESIGNER}")
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          echo "Running: python -m visual_engine.nsaa_esat_batch ${ARGS[*]}"
          echo "Policy: Math1/Math2=100% diagram; Physics mixed; ratio 1:1:3"
          python -m visual_engine.nsaa_esat_batch "${ARGS[@]}"

      - name: Run single-subject NSAA batch (chemistry/biology)
        if: steps.params.outputs.mode != 'esat'
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT="${{ steps.params.outputs.mode }}"
          N="${{ steps.params.outputs.n }}"
          ONLY="${{ steps.params.outputs.only_visuals }}"
          MODEL="${{ steps.params.outputs.model }}"
          DIAG="${{ steps.params.outputs.diagrams_only }}"
          FORCE="${{ steps.params.outputs.force }}"

          if [ -n "$MODEL" ]; then
            export MODEL_DIAGRAM_DESIGNER="$MODEL"
          fi

          ARGS=(--subject "$SUBJECT" --n "$N" --model "${MODEL_DIAGRAM_DESIGNER}")
          if [ "$DIAG" = "true" ]; then
            ARGS+=(--diagrams-only)
          fi
          if [ -n "$ONLY" ]; then
            ARGS+=(--only-visuals "$ONLY")
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi

          echo "Running: python -m visual_engine.nsaa_batch ${ARGS[*]}"
          python -m visual_engine.nsaa_batch "${ARGS[@]}"

      - name: Package review_data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual_engine/review_data
          python - <<'PY'
          import json
          from pathlib import Path
          from visual_engine.review_store import ReviewStore
          status_esat = Path("visual_engine/review_data/nsaa_esat_batch_status.json")
          status_legacy = Path("visual_engine/review_data/nsaa_batch_status.json")
          store = ReviewStore()
          meta = {
              "db_path": str(store.db_path),
              "counts": store.counts(),
              "subject_counts": store.subject_counts() if hasattr(store, "subject_counts") else {},
              "esat_status": json.loads(status_esat.read_text(encoding="utf-8")) if status_esat.is_file() else None,
              "nsaa_status": json.loads(status_legacy.read_text(encoding="utf-8")) if status_legacy.is_file() else None,
          }
          Path("visual_engine/review_data/ci_run_meta.json").write_text(
              json.dumps(meta, indent=2), encoding="utf-8"
          )
          print(json.dumps({k: meta[k] for k in ("counts", "subject_counts")}, indent=2))
          PY
          tar -C visual_engine -czf "$GITHUB_WORKSPACE/nsaa-review-data.tgz" review_data

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsaa-review-esat-${{ github.run_id }}
          path: nsaa-review-data.tgz
          if-no-files-found: warn
          retention-days: 30
